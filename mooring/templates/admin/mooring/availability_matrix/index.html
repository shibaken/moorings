{% extends 'admin/base_site.html' %}
{% load static %}

{% block extrahead %}
    {{ block.super }}
    <link rel="stylesheet" type="text/css" href="{% static 'mooring/availability_matrix/css/matrix.css' %}">
{% endblock %}

{% block content %}
<div id="matrix-root" class="availability-matrix-container">
    <h1>Mooring Availability Matrix</h1>
    <p class="avm-status">Loading D3.js&hellip;</p>

    <div class="avm-toolbar">
        <label for="avm-granularity">Granularity:</label>
        <select id="avm-granularity">
            <option value="day">Day</option>
            <option value="week">Week</option>
            <option value="month">Month</option>
        </select>
        <button type="button" id="avm-prev">&laquo; Prev</button>
        <button type="button" id="avm-today">Today</button>
        <button type="button" id="avm-next">Next &raquo;</button>
        <span id="avm-date-label" class="avm-date-label"></span>
    </div>

    <svg id="matrix-svg" class="avm-svg" width="240" height="24"></svg>

    <div class="avm-legend">
        <span class="avm-legend-item avm-legend-open">Open</span>
        <span class="avm-legend-item avm-legend-closed">Closed</span>
        <span class="avm-legend-item avm-legend-partial">Partial</span>
        <span class="avm-legend-item avm-legend-no-data">No data</span>
    </div>
</div>

<script src="{% static 'mooring/availability_matrix/js/api.js' %}"></script>
<script src="{% static 'mooring/availability_matrix/js/tree.js' %}"></script>
<script src="{% static 'mooring/availability_matrix/js/timeline.js' %}"></script>
<script src="{% static 'mooring/availability_matrix/js/matrix.js' %}"></script>
<script src="{% static 'mooring/availability_matrix/js/interactions.js' %}"></script>
<script>
    (function loadD3(cdnUrl, vendoredUrl) {
        var script = document.createElement('script');
        script.src = cdnUrl;
        script.onload = onD3Ready;
        script.onerror = function () {
            var fallbackScript = document.createElement('script');
            fallbackScript.src = vendoredUrl;
            fallbackScript.onload = onD3Ready;
            fallbackScript.onerror = onD3Failed;
            document.head.appendChild(fallbackScript);
        };
        document.head.appendChild(script);

        function onD3Ready() {
            var statusEl = document.querySelector('#matrix-root .avm-status');
            statusEl.textContent = 'D3 v' + d3.version + ' loaded OK';
            console.log('D3 v' + d3.version + ' loaded OK');

            if (window.MooringMatrix && typeof window.MooringMatrix.init === 'function') {
                window.MooringMatrix.init();
            }

            if (window.MooringInteractions && typeof window.MooringInteractions.init === 'function') {
                window.MooringInteractions.init();
            }

            if (window.MooringTree && typeof window.MooringTree.init === 'function') {
                var treeInit = window.MooringTree.init();
                if (treeInit && typeof treeInit.then === 'function') {
                    treeInit.catch(function (error) {
                        statusEl.textContent = 'D3 v' + d3.version + ' loaded OK, but the tree failed to load: ' + error.message;
                        console.error('Availability matrix tree load failed:', error);
                    });
                }
            }

            if (window.MooringTimeline && typeof window.MooringTimeline.init === 'function') {
                window.MooringTimeline.init();
            }
        }

        function onD3Failed() {
            var statusEl = document.querySelector('#matrix-root .avm-status');
            statusEl.textContent = 'D3 failed to load from both CDN and vendored fallback';
        }
    })(
        'https://d3js.org/d3.v7.min.js',
        "{% static 'mooring/availability_matrix/js/vendor/d3.v7.min.js' %}"
    );
</script>
{% endblock %}
